<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="SRABANI SEED FARM Logo">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C64F"/>
      <stop offset="50%" stop-color="#D6A52C"/>
      <stop offset="100%" stop-color="#A87A14"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E9E4D"/>
      <stop offset="100%" stop-color="#164D2A"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Mark -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Circle -->
    <circle cx="32" cy="32" r="30" fill="#EAF4E9" stroke="#237A3B" stroke-width="2"/>
    <circle cx="32" cy="32" r="26" fill="#FFFFFF" stroke="#D6A52C" stroke-width="1.5" stroke-dasharray="2,2"/>
    
    <!-- Central Leaf / Seed Sprout -->
    <path d="M32 14 C44 24, 44 42, 32 50 C20 42, 20 24, 32 14 Z" fill="url(#greenGrad)"/>
    <path d="M32 16 L32 48" stroke="#EAF4E9" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Left Golden Paddy Ear -->
    <path d="M22 24 C19 22, 17 25, 20 28 C23 27, 24 25, 22 24 Z" fill="url(#goldGrad)"/>
    <path d="M20 30 C17 28, 15 31, 18 34 C21 33, 22 31, 20 30 Z" fill="url(#goldGrad)"/>
    <path d="M22 36 C19 35, 17 38, 20 41 C23 40, 24 38, 22 36 Z" fill="url(#goldGrad)"/>
    
    <!-- Right Golden Paddy Ear -->
    <path d="M42 24 C45 22, 47 25, 44 28 C41 27, 40 25, 42 24 Z" fill="url(#goldGrad)"/>
    <path d="M44 30 C47 28, 49 31, 46 34 C43 33, 42 31, 44 30 Z" fill="url(#goldGrad)"/>
    <path d="M42 36 C45 35, 47 38, 44 41 C41 40, 40 38, 42 36 Z" fill="url(#goldGrad)"/>
    
    <!-- Base Stem Arc -->
    <path d="M20 44 C26 50, 38 50, 44 44" fill="none" stroke="#D6A52C" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Wordmark -->
  <g transform="translate(85, 18)">
    <text x="0" y="24" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#164D2A" letter-spacing="1.2">SRABANI</text>
    <text x="100" y="24" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#D6A52C" letter-spacing="1.2">SEED</text>
    <text x="0" y="45" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#237A3B" letter-spacing="2.5">FARM</text>
    <circle cx="68" cy="40" r="2" fill="#D6A52C"/>
    <text x="76" y="43" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#555555" letter-spacing="1">SABANG, WEST BENGAL</text>
  </g>
</svg>
